services:
  - type: web
    name: mwamba-pos-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://mwamba-pos.vercel.app,https://mwamba-pos-git-main-coskleakeys-projects.vercel.app,https://mwamba-95nnfy17a-coskleakeys-projects.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/mwamba_pos.db
    disk:
      name: mwamba-pos-data
      mountPath: /var/data
      sizeGB: 1
